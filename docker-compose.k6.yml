services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/games.db
    volumes:
      - k6-db-data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/games"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  k6:
    image: grafana/k6:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      - BASE_URL=http://api:8080
      - TEST_FILE  # optional, set in the host shell to run a single file, e.g. TEST_FILE=games.js
    entrypoint: ["/bin/sh", "/scripts/run.sh"]
    volumes:
      - ./GameLibrary.k6:/scripts:ro
      - ./GameLibrary.k6/results:/results

volumes:
  # Fresh volume every run: `docker compose -f docker-compose.k6.yml down -v`
  # (done automatically by scripts/run-k6-tests.sh) wipes it, so the API
  # starts from a clean, freshly-migrated database each time.
  k6-db-data:
