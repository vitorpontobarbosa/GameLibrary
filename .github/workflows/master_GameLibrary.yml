name: Build and Test .NET API

on:
  push:
    branches:
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build com logs detalhados
        run: dotnet build --configuration Release --verbosity normal

      - name: Testes unitários
        run: dotnet test --logger "console;verbosity=detailed"

  k6-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Rodar testes k6
        run: ./scripts/run-k6-tests.sh

      - name: Publicar resultados k6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: GameLibrary.k6/results/
