name: Build and Test .NET API

on:
  push:
    branches:
      - master

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore

      - name: Build com logs detalhados
        run: dotnet build --configuration Release --verbosity normal

      - name: Testes unitários
        run: dotnet test --logger "console;verbosity=detailed"

  k6-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Rodar testes k6
        run: ./scripts/run-k6-tests.sh

      - name: Publicar resultados k6
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: GameLibrary.k6/results/

  cypress-tests:
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Subir API e frontend (docker compose)
        run: docker compose up -d --build

      - name: Aguardar API e frontend ficarem prontos
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8080/api/games > /dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 2; done'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: gamelibrary-web/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: gamelibrary-web
        run: npm ci

      - name: Rodar testes end-to-end (Cypress)
        working-directory: gamelibrary-web
        run: npx cypress run
        env:
          CYPRESS_BASE_URL: http://localhost:3000
          CYPRESS_API_URL: http://localhost:8080

      - name: Publicar screenshots do Cypress (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: gamelibrary-web/cypress/screenshots/

      - name: Derrubar containers
        if: always()
        run: docker compose down -v
