services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/games.db
      # Jwt__Key / Jwt__Issuer / Jwt__Audience fall back to appsettings.json if unset.
      # - Jwt__Key=changeme
      # - Jwt__Issuer=GameLibrary
      # - Jwt__Audience=GameLibraryUsers
    volumes:
      - gamelibrary-data:/app/data

  web:
    build:
      context: ./gamelibrary-web
      dockerfile: Dockerfile
      args:
        # Browser-facing URL of the API (baked into the JS bundle at build time).
        - VITE_API_URL=http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  gamelibrary-data:
